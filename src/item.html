<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <title>Greener Groceries - Item Details</title>
</head>

<body>

    <!-- navbar -->
    <header>
        <nav class="navbar navbar-expand-xl navbar-dark brand_color_set">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Greener Groceries</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDark"
                    aria-controls="navbarDark" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse show" id="navbarDark">
                    <ul class="navbar-nav me-auto mb-2 mb-xl-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="summary.html">Cart</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="checkout.html">Checkout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Item Detail Page -->
    <div class="container my-5">
        <h2>Item Details : Tomato</h2>
        <div class="row justify-content-center">
            <div class="card item_card p-4">
                <img src="img/item1.jpg" class="card-img-top img-thumbnail" alt="Tomato image" />
                <div class="card-body">
                    <h3 class="card-title">Tomato</h3>
                    <p class="card-text">
                        Fresh, organic tomatoes picked directly from sustainable farms. Perfect for salads, sauces, and
                        sandwiches.
                    </p>
                    <p class="card-text fw-bold">Price: AUD $10.00</p>
                    <button type="button" class="btn btn-outline-success buttonstyle">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</html>
