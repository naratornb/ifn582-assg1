<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Greener Groceries - Checkout</title>
</head>

<body>

    <!-- navbar -->
    <header>
        <nav class="navbar navbar-expand-xl navbar-dark brand_color_set">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Greener Groceries</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDark"
                    aria-controls="navbarDark" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse show" id="navbarDark">
                    <ul class="navbar-nav me-auto mb-2 mb-xl-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="delivery_request.html">Cart</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="checkout.html">Checkout</a>
                        </li>
                    </ul>
                    <!-- User Info Section -->
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item d-flex align-items-center">
                            <i class="bi bi-person-circle me-2" style="font-size: 1.2rem;"></i>
                            <span class="navbar-text text-white">Somsri Doe</span>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <!-- Checkout Container -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Checkout</h2>

        <div class="row">
            <!-- Left: Order Summary -->
            <div class="col-md-6 mb-4">
                <h4>Order Summary</h4>
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between">
                        <div>Tomato x2</div>
                        <div>AUD $20.00</div>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <div>Pear x1</div>
                        <div>AUD $5.00</div>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <div>Subtotal</div>
                        <div>AUD $25.00</div>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <div>Delivery Fees</div>
                        <div>AUD $5.00</div>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <strong>Total</strong>
                        <strong>AUD $30.00</strong>
                    </li>
                </ul>
            </div>

            <!-- Right: Recipient + Delivery Form -->
            <div class="col-md-6">
                <h4>Recipient Details</h4>
                <form>
                    <div class="mb-3">
                        <label for="recipientName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="recipientName" required>
                    </div>
                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number (+61)</label>
                        <input type="tel" class="form-control" id="phoneNumber" placeholder="+61 4xx xxx xxx" required>
                    </div>
                    <div class="mb-3">
                        <label for="deliveryAddress" class="form-label">Delivery Address (within Australia)</label>
                        <textarea class="form-control" id="deliveryAddress" rows="3" required></textarea>
                    </div>

                    <h4 class="mt-4">Delivery Method</h4>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="deliveryMethod" id="greenDelivery" checked>
                        <label class="form-check-label" for="greenDelivery">
                            Green Delivery – AUD $5.00 (2–3 business days, low carbon)
                        </label>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="deliveryMethod" id="standardDelivery">
                        <label class="form-check-label" for="standardDelivery">
                            Standard Delivery – AUD $10.00 (2–3 business days)
                        </label>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="radio" name="deliveryMethod" id="expressDelivery">
                        <label class="form-check-label" for="expressDelivery">
                            Express Delivery – AUD $12.00 (Next-day delivery)
                        </label>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-success btn-lg">Confirm & Pay</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
