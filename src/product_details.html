<!DOCTYPE html>

<body>

    <!-- navbar -->

        <nav class="navbar navbar-expand-xl navbar-dark brand_color_set">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Greener Groceries</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDark"
                    aria-controls="navbarDark" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse show" id="navbarDark">
                    <ul class="navbar-nav me-auto mb-2 mb-xl-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">About Us</a>
                        </li>
                        <li class="nav-item">

                            <a class="nav-link active" href="checkout.html">Checkout</a>

                    <!-- User Info Section -->
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item d-flex align-items-center">

                    </ul>

    <div class="container my-5">

        <div class="row gx-5">
            <div class="col-md-6">
                <img src="img/item1.jpg" class="img-fluid rounded shadow-sm" alt="Tomato image">
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-center">
                <h3 class="mb-3">Tomato
                    <span class="badge bg-success text-white rounded-pill">Local Choice</span>
                </h3>
                <p class="text-muted">
                    Fresh, organic tomatoes picked directly from sustainable farms. Perfect for salads, sauces, and

                </p>
                <p class="fw-bold fs-5">Price: AUD $10.00</p>
                <div class="mb-3">
                    <label for="qty1" class="form-label">Quantity:</label>
                    <input type="number" id="qty1" class="form-control" value="1" min="1" style="width: 100px;">
                </div>
                <button type="button" class="btn btn-outline-success buttonstyle align-self-start">Add to Cart</button>
            </div>
        </div>
    </div>
    </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
