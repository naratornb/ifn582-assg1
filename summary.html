<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <title>Greener Groceries - Delivery Request Summary</title>
</head>

<body>
    <!-- navbar -->
    <header>
        <nav class="navbar navbar-expand-xl navbar-dark brand_color_set">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Greener Groceries</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDark"
                    aria-controls="navbarDark" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse show" id="navbarDark">
                    <ul class="navbar-nav me-auto mb-2 mb-xl-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="summary.html">Cart</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="checkout.html">Checkout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Delivery Request / Cart Summary Section -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Review Your Cart</h2>

        <!-- Cart Item List -->
        <div class="row justify-content-center">
            <div class="col-md-10">
                <ul class="list-group">
                    <!-- Cart Item -->
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Tomato</h5>
                            <small>Price: AUD $10.00</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <label for="qty1" class="form-label me-1 mb-0">Qty:</label>
                            <input type="number" id="qty1" class="form-control" value="2" min="1" style="width: 60px;">
                            <button class="btn btn-outline-danger btn-sm">Remove</button>
                        </div>
                    </li>

                    <!-- Another Cart Item -->
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Pear</h5>
                            <small>Price: AUD $5.00</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <label for="qty2" class="form-label me-1 mb-0">Qty:</label>
                            <input type="number" id="qty2" class="form-control" value="1" min="1" style="width: 60px;">
                            <button class="btn btn-outline-danger btn-sm">Remove</button>
                        </div>
                    </li>
                </ul>

                <!-- Checkout Button -->
                <div class="text-end mt-4">
                    <button class="btn btn-success btn-lg">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>


</body>

</html>
